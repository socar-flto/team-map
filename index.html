<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" id="robotsmeta" content="noindex, nofollow, noarchive, nosnippet">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경영전략팀 업무 관계도 · 페어링 맵</title>
<style>
  :root{
    --ink:#121820; --ink2:#48535f; --ink3:#8b96a2;
    --line:#e2e6eb; --bg:#f6f7f9; --card:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",-apple-system,system-ui,sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
  }
  header{padding:24px 32px 16px;border-bottom:1px solid var(--line);background:var(--card)}
  h1{font-size:19px;letter-spacing:-.4px;font-weight:700}
  h1 .ed,.sub .ed{border:1px dashed transparent;border-radius:4px;padding:1px 3px;outline:none}
  body.editing h1 .ed,body.editing .sub .ed{border-color:#cfd6de;background:#fcfdfe}
  .sub{font-size:13px;color:var(--ink3);margin-top:5px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
  .tab{
    border:1px solid var(--line);background:#fff;border-radius:999px;
    padding:7px 15px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;
    font-family:inherit;transition:.15s;white-space:nowrap;
  }
  .tab:hover{border-color:#c3cad3}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tab.ghost{background:#fff;color:var(--ink2)}
  .tab.edit.on{background:#b45309;border-color:#b45309}
  .tab.dl{background:#fff;border-color:#c3cad3}
  .spacer{flex:1}
  .tabhint{font-size:12px;color:var(--ink3)}
  .save{font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;min-height:20px}
  .save .dot{width:7px;height:7px;border-radius:50%;flex:none;background:currentColor}
  .save .q{font-weight:500;color:var(--ink3)}

  main{display:grid;grid-template-columns:minmax(0,1fr) 370px;align-items:start}
  @media (max-width:1200px){main{grid-template-columns:1fr}}

  #wrap{padding:20px;overflow:hidden}
  #stage{position:relative;transform-origin:top left}
  #zones,#nodes{position:absolute;inset:0}
  #edges{position:absolute;inset:0;overflow:visible}
  #nodes{z-index:2}
  #edges{z-index:1}
  #zones{z-index:0}

  .zone{position:absolute;border-radius:16px;border:1px dashed #d4dae1}
  .zone span{
    position:absolute;top:-10px;left:16px;background:var(--bg);padding:0 8px;
    font-size:11.5px;font-weight:700;letter-spacing:.2px;
  }
  /* 대분류(경영기획 / 전략기획) 겹침 박스 */
  .gzone{position:absolute;border-radius:20px;border:1px solid}
  .gzone span{
    position:absolute;top:-10px;background:var(--bg);padding:0 9px;
    font-size:11.5px;font-weight:700;letter-spacing:.2px;white-space:nowrap;
  }

  .node{
    position:absolute;width:168px;padding:11px 13px 12px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;cursor:pointer;
    box-shadow:0 1px 2px rgba(16,24,40,.04);transition:box-shadow .16s,opacity .16s;
    transform:translate(-50%,-50%);
  }
  .node:hover{box-shadow:0 6px 18px rgba(16,24,40,.10)}
  .node.sel{border-color:var(--ink);box-shadow:0 0 0 3px rgba(18,24,32,.08),0 6px 18px rgba(16,24,40,.10)}
  .node.dim{opacity:.3}
  .node.tbh{border-style:dashed;background:#fbfcfd}
  .node.lead{width:190px;border-color:#334155;background:#f8fafc}
  body.editing .node{cursor:grab}
  body.editing .node:active{cursor:grabbing}
  body.editing .node::after{
    content:'⠿';position:absolute;top:4px;right:7px;font-size:11px;color:#c3cad3;letter-spacing:-2px;
  }
  .node .nm{font-size:15px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .node .rl{font-size:11px;color:var(--ink3);margin-top:3px;font-weight:600}
  .node .dt{font-size:11px;color:var(--ink2);margin-top:7px;line-height:1.5}
  .node .dt .sep{color:#cfd6de;font-weight:400}
  .chip{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:5px;letter-spacing:.2px;white-space:nowrap}
  .chip.m{background:#111827;color:#fff}
  .chip.e{background:#eef1f4;color:#5b6773}
  .chip.t{background:#fff;color:#8b96a2;border:1px dashed #c3cad3}
  .chip.x{color:#fff}
  /* 도메인 분할 바 — 맨 위가 주 도메인 */
  .bar{
    position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:3px;
    overflow:hidden;display:flex;flex-direction:column;
  }
  .bar i{display:block;width:100%;flex:none}
  .barkey{
    display:flex;width:5px;min-height:24px;border-radius:3px;overflow:hidden;
    flex-direction:column;align-self:stretch;flex:none;
  }
  .barkey i{display:block;width:100%;flex:none}

  #panel{border-left:1px solid var(--line);background:var(--card);min-height:100vh;padding:22px 20px 80px}
  #panel h2{font-size:16px;letter-spacing:-.3px;margin-bottom:2px}
  #panel .ph{font-size:12px;color:var(--ink3);font-weight:600}
  .sec{margin-top:20px}
  .sec h3{
    font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.5px;margin-bottom:8px;
    display:flex;justify-content:space-between;align-items:center;gap:8px;
  }
  .sec p{font-size:13px;line-height:1.65;color:var(--ink2)}
  .kv{display:flex;gap:8px;font-size:12.5px;color:var(--ink2);margin-bottom:5px}
  .kv b{color:var(--ink);font-weight:600;min-width:68px;flex:none}
  .ol{list-style:none}
  .ol li{font-size:13px;color:var(--ink2);padding:5px 0 5px 24px;position:relative;line-height:1.5}
  .ol li::before{
    content:attr(data-n);position:absolute;left:0;top:5px;width:16px;height:16px;border-radius:5px;
    background:#eef1f4;color:#5b6773;font-size:10px;font-weight:700;display:grid;place-items:center;
  }
  .ol li:first-child::before{background:#111827;color:#fff}
  .rel{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .rel .rt{font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .rel .rt em{font-style:normal;font-size:10.5px;font-weight:700;color:var(--ink3);flex:none}
  .rel .rd{font-size:12px;color:var(--ink2);line-height:1.55;margin-top:5px}
  .empty{font-size:12.5px;color:var(--ink3)}
  .legend{display:flex;flex-direction:column;gap:9px}
  .lg{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink2)}
  .lg svg{flex:none}
  .risk{background:#fff8f1;border:1px solid #f5ddc4;border-radius:10px;padding:11px 13px;margin-bottom:8px}
  .risk .rt{font-size:12.5px;font-weight:700;color:#8a4e08}
  .risk .rd{font-size:12px;color:#7a5a32;line-height:1.55;margin-top:4px}
  footer{padding:16px 32px 40px;font-size:11.5px;color:var(--ink3);border-top:1px solid var(--line)}

  /* ---- 편집 폼 ---- */
  .f{margin-bottom:10px}
  .f label{display:block;font-size:10.5px;font-weight:700;color:var(--ink3);letter-spacing:.3px;margin-bottom:4px}
  .f input[type=text],.f textarea,.f select{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px;
    font-family:inherit;color:var(--ink);background:#fff;outline:none;line-height:1.5;
  }
  .f input:focus,.f textarea:focus,.f select:focus{border-color:#9aa5b1;box-shadow:0 0 0 3px rgba(18,24,32,.05)}
  .f textarea{resize:vertical;min-height:58px}
  .f .hint{font-size:10.5px;color:var(--ink3);margin-top:4px;line-height:1.5}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btn{
    border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;
    font-size:11.5px;font-weight:600;color:var(--ink2);cursor:pointer;font-family:inherit;
  }
  .btn:hover{border-color:#9aa5b1}
  .btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.dan{color:#b42318;border-color:#f3c6c1}
  .btn.dan:hover{background:#fef3f2}
  .btn.sm{padding:3px 8px;font-size:10.5px}
  .card{border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:9px;background:#fcfdfe}
  .card .ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
  .card .ch b{font-size:12px}
  .swatch{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.08);flex:none}
  .note{font-size:11.5px;color:var(--ink3);line-height:1.6;background:#f6f7f9;border-radius:8px;padding:9px 11px}

  #gate{position:fixed;inset:0;z-index:999;background:#f6f7f9;display:flex;align-items:center;justify-content:center;padding:24px}
  #gate .box{width:100%;max-width:380px;background:#fff;border:1px solid #e3e7ec;border-radius:14px;padding:26px 24px;box-shadow:0 10px 30px rgba(18,24,32,.07)}
  #gate h2{margin:0 0 6px;font-size:16px;font-weight:800;color:#121820;letter-spacing:-.2px}
  #gate .sub{font-size:12.5px;color:#6b7684;line-height:1.6;margin-bottom:18px}
  #gate input{width:100%;box-sizing:border-box;font:inherit;font-size:14px;padding:11px 12px;border:1px solid #d7dde4;border-radius:9px;background:#fff;color:#121820;letter-spacing:.4px}
  #gate input:focus{outline:none;border-color:#121820}
  #gate button{width:100%;margin-top:10px;font:inherit;font-size:13.5px;font-weight:700;padding:11px;border:0;border-radius:9px;background:#121820;color:#fff;cursor:pointer}
  #gate button[disabled]{opacity:.5;cursor:default}
  #gate .msg{min-height:17px;margin-top:10px;font-size:12px;color:#b4232a}
  #gate .foot{margin-top:16px;padding-top:14px;border-top:1px solid #eef1f4;font-size:11.5px;color:#9aa4b0;line-height:1.6}
  body.locked{overflow:hidden}
  /* 읽기 전용: 편집·되돌리기·저장상태 컨트롤을 감춘다 */
  #editBtn,#resetBtn,#saveState{display:none!important}
  .robanner{font-size:12px;color:#6b7684;display:flex;align-items:center;gap:7px;line-height:1.5}
  .robanner .ro-dot{width:6px;height:6px;border-radius:50%;background:#8b96a2;flex:none}
  .robanner .ro-when{color:#9aa4b0}
</style>
</head>
<body>

<div id="gate"><div class="box">
  <h2>경영전략팀 업무 관계도</h2>
  <div class="sub">팀 내부 자료입니다. 전달받은 암호를 입력해 주세요.</div>
  <input id="gpw" type="password" autocomplete="off" spellcheck="false" placeholder="암호" aria-label="암호">
  <button id="gbtn" type="button">열기</button>
  <div class="msg" id="gmsg"></div>
  <div class="foot">내용은 암호로 암호화되어 있어 암호 없이는 페이지 소스를 봐도 읽을 수 없습니다.</div>
</div></div>

<header>
  <h1><span class="ed" id="t-title"></span></h1>
  <div class="sub"><span class="ed" id="t-sub"></span></div>
  <div class="toolbar">
    <button class="tab on" data-view="mentor">멘토링 뷰</button>
    <button class="tab" data-view="domain">도메인 뷰</button>
    <button class="tab" data-view="backup">백업 라인 뷰</button>
    <span class="spacer"></span>
    <span class="tabhint" id="hint">카드를 클릭하면 상세가 보입니다</span>
    <button class="tab edit" id="editBtn">✎ 편집 모드</button>
    <button class="tab dl" id="dlBtn">↓ HTML로 내려받기</button>
  </div>
  <div class="toolbar" style="margin-top:10px">
    <span class="robanner"><span class="ro-dot"></span>읽기 전용입니다 — 이 페이지는 배포된 시점의 내용으로 고정되어 있고, 보는 쪽에서 고쳐도 저장되지 않습니다.<span class="ro-when">기준 2026.10.26.16:16</span></span>
    <span class="save" id="saveState"></span>
    <span class="spacer"></span>
    <button class="tab ghost" id="resetBtn">↺ 원본으로 되돌리기</button>
  </div>
</header>

<main>
  <div id="wrap">
    <div id="stage">
      <div id="zones"></div>
      <svg id="edges"><defs id="defs"></defs><g id="elayer"></g></svg>
      <div id="nodes"></div>
    </div>
  </div>
  <aside id="panel"></aside>
</main>

<script id="appcode" type="text/plain">
/* ======================= 상태 ======================= */
const DATA_EL = document.getElementById('appdata');
/* 파일에 구워진 원본 — '원본으로 되돌리기'의 기준점 */
const BASE_JSON = DATA_EL.textContent;

/* ---- 브라우저 자동 저장 ----
   이 파일을 컴퓨터에서 열어 쓰는 것을 전제로 합니다. 수정하면 즉시 브라우저에
   저장되고, 같은 파일을 다시 열면 그대로 복원됩니다. 저장소를 쓸 수 없는
   환경(미리보기 등)에서는 조용히 비활성화되고 상단에 그 사실을 표시합니다. */
const STORE_KEY = 'socar-team-map-web/v1';
let storeOK = true, restored = false, savedAt = null, saveTimer = null;

function lsGet(){ try{ return window.localStorage.getItem(STORE_KEY); }catch(e){ storeOK=false; return null; } }
function lsSet(v){ return true; } /* readonly: 저장하지 않는다 */
function lsDel(){ try{ window.localStorage.removeItem(STORE_KEY); }catch(e){ storeOK=false; } }

function normalize(o){
  if(!o || !o.people || !o.order) return null;
  if(!o.groups) o.groups = {};
  if(!o.domains) o.domains = {};
  ['mentor','peer','backup','risks','principles'].forEach(k=>{ if(!Array.isArray(o[k])) o[k]=[]; });
  o.order = o.order.filter(i=>o.people[i]);
  Object.keys(o.people).forEach(i=>{ if(!o.order.includes(i)) o.order.push(i); });
  return o;
}

let S = (function(){
  const raw = null; /* readonly: 저장본을 불러오지 않는다 */
  if(raw){
    try{ const o = normalize(JSON.parse(raw)); if(o){ restored = true; return o; } }
    catch(e){ /* 저장본이 깨졌으면 원본으로 간다 */ }
  }
  return JSON.parse(BASE_JSON);
})();
if(!S.order) S.order = Object.keys(S.people);

function paintSave(kind){
  const el = document.getElementById('saveState'); if(!el) return;
  const hhmm = savedAt ? String(savedAt.getHours()).padStart(2,'0')+':'+String(savedAt.getMinutes()).padStart(2,'0') : '';
  const row = (color,text,extra) =>
    `<span class="dot" style="color:${color}"></span><span style="color:${color}">${text}</span>`
    + (extra?`<span class="q">${extra}</span>`:'');
  if(!storeOK){
    el.innerHTML = row('#b42318','자동 저장을 쓸 수 없는 환경입니다','수정 후 ↓ HTML로 내려받기로 보관하세요');
  }else if(kind==='saving'){
    el.innerHTML = row('#b45309','저장 중…','');
  }else if(kind==='saved'){
    el.innerHTML = row('#047857','자동 저장됨'+(hhmm?' · '+hhmm:''),'이 브라우저에서 파일을 다시 열면 그대로 복원됩니다');
  }else if(kind==='restored'){
    el.innerHTML = row('#047857','저장해 둔 수정 내용을 불러왔습니다','되돌리려면 오른쪽 ↺ 원본으로 되돌리기');
  }else{
    el.innerHTML = row('#8b96a2','수정하면 이 브라우저에 자동 저장됩니다','');
  }
}
/* 모든 편집 동작 뒤에 호출 — 짧게 모아 한 번만 쓴다 */
function touch(){
  if(!storeOK){ paintSave(); return; }
  paintSave('saving');
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    saveTimer = null;
    if(lsSet(JSON.stringify(S))){ savedAt = new Date(); paintSave('saved'); }
    else paintSave();
  }, 300);
}
function resetToOriginal(){
  const msg = '이 브라우저에 저장된 수정 내용을 모두 지우고, 파일에 구워진 원본 상태로 돌아갑니다. 계속할까요?';
  if(typeof confirm==='function' && !confirm(msg)) return;
  lsDel();
  S = JSON.parse(BASE_JSON);
  if(!S.order) S.order = Object.keys(S.people);
  if(!S.groups) S.groups = {};
  window.S = S;
  sel = null; savedAt = null; restored = false;
  renderAll(); paintSave();
}

let view='mentor', sel=null, edit=false, scale=1;
const TIERS = {lead:'팀장', mentor:'멘토급', mentee:'멘티급'};
const TIERCHIP = {lead:'', mentor:'<span class="chip m">멘토급</span>', mentee:'<span class="chip e">멘티급</span>'};

const $  = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const dom = k => S.domains[k] || {label:k, color:'#8b96a2'};
const nameOf = id => (S.people[id]||{}).n || id;
const ids = () => S.order.filter(i=>S.people[i]);

/* ---- 도메인 2단 구조 헬퍼 ---- */
if(!S.groups) S.groups = {};
const grp = gk => S.groups[gk] || {label:gk, color:'#8b96a2'};
const gkeys = () => Object.keys(S.groups);
const dkeys = () => Object.keys(S.domains).filter(k=>k!=='lead');
/* 한 사람의 도메인 목록 — 맨 앞이 주 도메인 */
function domsOf(id){
  const p=S.people[id]||{};
  const a=(p.doms||[]).filter(k=>S.domains[k]);
  return a.length?a:['lead'];
}
const primary = id => domsOf(id)[0];
/* 그 사람이 걸친 대분류 */
function groupsOf(id){
  const out=[];
  domsOf(id).forEach(k=>{ const g=S.domains[k].group; if(g&&S.groups[g]&&!out.includes(g)) out.push(g); });
  return out;
}
const isCross = id => groupsOf(id).length>1;
/* #rrggbb → rgba(…, a) */
function hexA(hex,a){
  const h=String(hex||'').replace('#','');
  if(h.length!==6) return `rgba(139,150,162,${a})`;
  return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`;
}
/* 분할 바 — 주 도메인이 절반, 나머지가 아래를 균등 분할 */
function barHTML(list,cls){
  const a = list && list.length ? list : ['lead'];
  if(a.length===1) return `<div class="${cls}"><i style="height:100%;background:${dom(a[0]).color}"></i></div>`;
  const rest = (50/(a.length-1)).toFixed(2);
  return `<div class="${cls}">`+a.map((k,i)=>
    `<i style="height:${i===0?50:rest}%;background:${dom(k).color}"></i>`).join('')+`</div>`;
}

/* ======================= 그래프 렌더 ======================= */
function nodeW(id){ return S.people[id].tier==='lead' ? 190 : 168; }
function nodeH(id){ const el=$('n-'+id); return el?el.offsetHeight:92; }
function crossChip(id){
  const g=groupsOf(id);
  return `<span class="chip x" title="${esc(g.map(k=>grp(k).label).join(' + '))}" `
       + `style="background:linear-gradient(90deg,${grp(g[0]).color},${grp(g[g.length-1]).color})">교차</span>`;
}

function renderNodes(){
  const box=$('nodes'); box.innerHTML='';

function positionNodes(){
  ids().forEach(id=>{ const el=$('n-'+id); if(el){ el.style.left=S.people[id].x+'px'; el.style.top=S.people[id].y+'px'; } });
}
/* 대분류 두 개를 겹치는 배경 박스로 — 겹친 띠에 놓인 사람이 교차 인물 */
function renderZones(){
  const box=$('zones'); box.innerHTML='';
  gkeys().forEach((gk,gi)=>{
    const mem=ids().filter(i=>groupsOf(i).includes(gk));
    if(!mem.length) return;
    let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
    mem.forEach(i=>{ const p=S.people[i], w=nodeW(i), h=nodeH(i);
      x1=Math.min(x1,p.x-w/2); x2=Math.max(x2,p.x+w/2); y1=Math.min(y1,p.y-h/2); y2=Math.max(y2,p.y+h/2); });
    const px=26+gi*12, py=30+gi*13;
    const g=grp(gk);
    const el=document.createElement('div');
    el.className='gzone';
    el.style.cssText=`left:${x1-px}px;top:${y1-py}px;width:${x2-x1+px*2}px;height:${y2-y1+py*2}px;`
      + `border-color:${hexA(g.color,.38)};background:${hexA(g.color,.045)}`;
    el.innerHTML=`<span style="color:${g.color};${g.side==='right'?'right:20px':'left:20px'}">`
      + `${esc(g.label)} · ${mem.length}명</span>`;
    box.appendChild(el);
  });
}
function renderDefs(){
  const d=$('defs'); d.innerHTML='';
  Object.keys(S.domains).forEach(k=>{
    d.insertAdjacentHTML('beforeend',
      `<marker id="mk-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${dom(k).color}"/></marker>`);
  });
}
function edgePath(a,b){
  const A=S.people[a], B=S.people[b];
  const Aw=nodeW(a),Ah=nodeH(a),Bw=nodeW(b),Bh=nodeH(b);
  const dx=B.x-A.x, dy=B.y-A.y;
  let x1=A.x,y1=A.y,x2=B.x,y2=B.y;
  const vert = Math.abs(dy)>Math.abs(dx)*0.6;
  if(vert){ y1=A.y+(dy>0?Ah/2:-Ah/2); y2=B.y+(dy>0?-Bh/2:Bh/2); }
  else    { x1=A.x+(dx>0?Aw/2:-Aw/2); x2=B.x+(dx>0?-Bw/2:Bw/2); }
  const mx=(x1+x2)/2, my=(y1+y2)/2;
  return vert ? `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`
              : `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;
}
function addLine(a,b,d,dash,arrow){
  if(!S.people[a]||!S.people[b]) return;
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',edgePath(a,b));
  p.setAttribute('fill','none');
  p.setAttribute('stroke',dom(d).color);
  p.setAttribute('stroke-width',dash?1.4:2);
  p.setAttribute('stroke-opacity',dash?.45:.7);
  if(dash) p.setAttribute('stroke-dasharray','5 5');
  if(arrow) p.setAttribute('marker-end',`url(#mk-${d})`);
  p.dataset.a=a; p.dataset.b=b;
  $('elayer').appendChild(p);
}
function drawEdges(){
  $('elayer').innerHTML='';
  if(view==='mentor'){
    S.mentor.forEach(e=>addLine(e.a,e.b,e.dom,!!e.dash,true));
    S.peer.forEach(e=>{
      const pa=S.people[e.a], pb=S.people[e.b];
      if(pa&&pb&&pa.tier==='mentee'&&pb.tier==='mentee') addLine(e.a,e.b,e.dom,true,false);
    });
  }else if(view==='domain'){
    S.mentor.filter(e=>e.dom==='lead').forEach(e=>addLine(e.a,e.b,e.dom,true,false));
    S.peer.forEach(e=>addLine(e.a,e.b,e.dom,true,false));
    S.mentor.filter(e=>e.dom!=='lead').forEach(e=>addLine(e.a,e.b,e.dom,false,true));
  }else{
    S.backup.forEach(g=>{ for(let i=0;i<g.chain.length-1;i++) addLine(g.chain[i],g.chain[i+1],g.dom,i>0,true); });
  }
  applyHighlight();
}
function applyHighlight(){
  const ns=[...document.querySelectorAll('.node')];
  if(!sel||edit){
    ns.forEach(n=>{ n.classList.remove('dim'); n.classList.toggle('sel', n.id==='n-'+sel); });
    [...$('elayer').children].forEach(p=>{
      const d=p.getAttribute('stroke-dasharray');
      p.setAttribute('stroke-opacity', d?.45:.7); p.setAttribute('stroke-width', d?1.4:2);
    });
    return;
  }
  const linked=new Set([sel]);
  [...$('elayer').children].forEach(p=>{
    const on=p.dataset.a===sel||p.dataset.b===sel;
    p.setAttribute('stroke-opacity', on?.95:.12);
    p.setAttribute('stroke-width', on?2.6:1.2);
    if(on){ linked.add(p.dataset.a); linked.add(p.dataset.b); }
  });
  ns.forEach(n=>{ const id=n.id.slice(2);
    n.classList.toggle('dim', !linked.has(id));
    n.classList.toggle('sel', id===sel); });
}
function fit(){
  let w=1180,h=660;
  /* 대분류 배경 박스 패딩까지 들어갈 여유를 둔다 */
  ids().forEach(i=>{ const p=S.people[i]; w=Math.max(w,p.x+nodeW(i)/2+75); h=Math.max(h,p.y+nodeH(i)/2+70); });
  const st=$('stage'); st.style.width=w+'px'; st.style.height=h+'px';
  const sv=$('edges'); sv.setAttribute('width',w); sv.setAttribute('height',h);
  const avail=$('wrap').clientWidth-40;
  scale=Math.min(1, avail/w);
  st.style.transform=`scale(${scale})`;
  $('wrap').style.height=(h*scale+40)+'px';
}
function refreshGraph(){ renderNodes(); renderDefs(); renderZones(); drawEdges(); fit(); }
function renderAll(){ renderText(); refreshGraph(); renderPanel(); }
function renderText(){

  document.title=S.title;
}

/* ======================= 드래그 & 선택 ======================= */
let drag=null;
function startDrag(e,id){
  if(!edit){ return; }
  e.preventDefault();
  drag={id, ox:e.clientX, oy:e.clientY, px:S.people[id].x, py:S.people[id].y, moved:false};
}
window.addEventListener('mousemove', e=>{
  if(!drag) return;
  const dx=(e.clientX-drag.ox)/scale, dy=(e.clientY-drag.oy)/scale;
  if(Math.abs(dx)>3||Math.abs(dy)>3) drag.moved=true;
  const p=S.people[drag.id];
  p.x=Math.max(100, Math.round(drag.px+dx));
  p.y=Math.max(40,  Math.round(drag.py+dy));
  positionNodes(); drawEdges(); renderZones();
});
window.addEventListener('mouseup', ()=>{
  if(drag){ const moved=drag.moved, id=drag.id; drag=null; fit();
    if(!moved) select(id); else { if(sel===id) renderPanel(); touch(); } }
});
$('nodes').addEventListener('click', e=>{
  if(edit) return;
  const n=e.target.closest('.node'); if(n) select(n.id.slice(2));
});
function select(id){ sel = (sel===id?null:id); renderPanel(); applyHighlight(); }

/* ======================= 조회 헬퍼 ======================= */
function relOf(id){
  const out=[];
  S.mentor.forEach(e=>{ if(e.dom==='lead') return;
    if(e.a===id) out.push({dir:'→ 서포트 제공', who:nameOf(e.b), ...e});
    if(e.b===id) out.push({dir:'← 서포트 받음', who:nameOf(e.a), ...e}); });
  S.peer.forEach(e=>{
    if(e.a===id) out.push({dir:'↔ 수평 분담', who:nameOf(e.b), ...e});
    if(e.b===id) out.push({dir:'↔ 수평 분담', who:nameOf(e.a), ...e}); });
  return out;
}
function bkOf(id){
  const out=[];
  S.backup.forEach(g=>{ const i=g.chain.indexOf(id);
    if(i>=0) out.push({t:g.t, rank:['1차 담당','2차 백업','3차 백업','4차 백업'][i]||(i+1)+'차', dom:g.dom,
                       chain:g.chain.map(nameOf).join(' → ')}); });
  return out;
}

function relEditList(id){
  const rows=[];
  S.mentor.forEach((e,i)=>{ if(e.a===id||e.b===id) rows.push(relCard('mentor',i,e)); });
  S.peer.forEach((e,i)=>{ if(e.a===id||e.b===id) rows.push(relCard('peer',i,e)); });
  return rows.length?rows.join(''):'<div class="empty">연결이 없습니다. 목록 화면에서 추가할 수 있습니다.</div>';
}
function relCard(kind,i,e){
  const arrow = kind==='mentor' ? '→' : '↔';
  return `<div class="card">
    <div class="ch"><b>${esc(nameOf(e.a))} ${arrow} ${esc(nameOf(e.b))}</b>
      <button class="btn dan sm" onclick="delRel('${kind}',${i})">삭제</button></div>
    <div class="row2">
      <div class="f"><label>From</label><select onchange="setRel('${kind}',${i},'a',this.value)">${peopleOpts(e.a)}</select></div>
      <div class="f"><label>To</label><select onchange="setRel('${kind}',${i},'b',this.value)">${peopleOpts(e.b)}</select></div>
    </div>
    <div class="row2">
      <div class="f"><label>선 색(도메인)</label><select onchange="setRel('${kind}',${i},'dom',this.value)">${domOpts(e.dom)}</select></div>
      <div class="f"><label>라벨</label><input type="text" value="${esc(e.kind)}" oninput="setRel('${kind}',${i},'kind',this.value)"></div>

/* ======================= 편집 동작 ======================= */
function setP(id,k,v){ S.people[id][k]=v; refreshGraph(); if(k==='n'){ const h=$('panel').querySelector('h2'); if(h) h.textContent=v; } }
function setDoms(id,v){
  const byLabel={}; Object.keys(S.domains).forEach(k=>{ byLabel[dom(k).label]=k; });
  const out=[];
  v.split('>').map(s=>s.trim()).filter(Boolean).forEach(s=>{
    const k = byLabel[s] || (S.domains[s] ? s : null);
    if(k && !out.includes(k)) out.push(k);
  });
  S.people[id].doms = out;
  refreshGraph();
}
function setLines(id,k,v){ S.people[id][k]=v.split('\n').map(s=>s.trim()).filter(Boolean); refreshGraph(); }
function setInfo(id,v){
  S.people[id].info = v.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>{
    const i=s.indexOf(':'); return i<0?[s,'']:[s.slice(0,i).trim(), s.slice(i+1).trim()]; });
}
function setRel(kind,i,k,v){ S[kind][i][k]=v; drawEdges(); }
function delRel(kind,i){ S[kind].splice(i,1); refreshGraph(); renderPanel(); }
function addRel(kind){
  const list=ids(); if(list.length<2) return;
  S[kind].push({a:list[0], b:list[1], dom:primary(list[0]), kind: kind==='mentor'?'메인 페어':'수평 분담', desc:'', dash:false});
  refreshGraph(); renderPanel();
  setTimeout(()=>{ const el=$('panel'); if(el&&el.scrollIntoView) el.scrollIntoView({block:'end'}); },0);
}
function newId(){ let i=1; while(S.people['p'+i]) i++; return 'p'+i; }
function addPerson(){
  const id=newId();
  const base=dkeys()[0]||'lead';
  S.people[id]={n:'새 멤버', tier:'mentee', doms:[base], x:200, y:700, role:'멘티급', line:'출신 배경',
                info:[], duties:[], bgText:'', note:''};
  S.order.push(id); refreshGraph(); select(id);
}
function delPerson(id){
  if(!confirm(nameOf(id)+' 을(를) 삭제할까요? 연결된 선과 백업 라인에서도 빠집니다.')) return;
  delete S.people[id];
  S.order=S.order.filter(x=>x!==id);
  S.mentor=S.mentor.filter(e=>e.a!==id&&e.b!==id);
  S.peer  =S.peer.filter(e=>e.a!==id&&e.b!==id);
  S.backup.forEach(g=>g.chain=g.chain.filter(c=>c!==id));
  sel=null; refreshGraph(); renderPanel();
}
function setBk(i,k,v){ S.backup[i][k]=v; drawEdges(); }
function setChain(i,v){
  const byName={}; ids().forEach(x=>byName[nameOf(x)]=x);
  S.backup[i].chain = v.split('>').map(s=>s.trim()).filter(Boolean).map(s=>byName[s]).filter(Boolean);
  drawEdges();
}
function addBackup(){ S.backup.push({t:'새 업무', dom:dkeys()[0]||'lead', chain:[], note:''}); renderPanel(); }
function delBackup(i){ S.backup.splice(i,1); drawEdges(); renderPanel(); }
function setDom(k,f,v){ S.domains[k][f]=v; refreshGraph(); if(f==='group') renderPanel(); }
function addDomain(){
  let i=1; while(S.domains['d'+i]) i++;
  S.domains['d'+i]={label:'새 도메인', color:'#64748b', group:gkeys()[0]||null};
  renderPanel();
}
function delDomain(k){
  if(ids().some(i=>domsOf(i).includes(k))){ alert('이 도메인을 쓰는 인물이 있어 삭제할 수 없습니다.'); return; }
  delete S.domains[k]; refreshGraph(); renderPanel();
}
function setGrp(gk,f,v){ S.groups[gk][f]=v; refreshGraph(); }
function addGroup(){
  let i=1; while(S.groups['g'+i]) i++;
  S.groups['g'+i]={label:'새 대분류', color:'#64748b', side:'left'};
  renderPanel();
}
function delGroup(gk){
  const used=dkeys().filter(k=>S.domains[k].group===gk);
  if(used.length){ alert('이 대분류에 속한 도메인이 있어 삭제할 수 없습니다: '+used.map(k=>dom(k).label).join(', ')); return; }
  delete S.groups[gk]; refreshGraph(); renderPanel();
}
function setItem(key,i,f,v){ S[key][i][f]=v; }
function addItem(key){ S[key]=S[key]||[]; S[key].push({t:'',d:''}); renderPanel(); }
function delItem(key,i){ S[key].splice(i,1); renderPanel(); }

/* 대분류 순서대로 늘어놓되, 교차 인물을 두 대분류의 경계에 모아 겹침 띠를 만든다 */
function autoLayout(){
  const lead=ids().filter(i=>S.people[i].tier==='lead');
  const rows={mentor:245, mentee:490};
  const cursor={mentor:105, mentee:105};
  const placed=new Set();
  const put=(i)=>{ const t=S.people[i].tier==='mentor'?'mentor':'mentee';
    S.people[i].x=cursor[t]; S.people[i].y=rows[t]; cursor[t]+=200; placed.add(i); };
  const sync=()=>{ const m=Math.max(cursor.mentor,cursor.mentee); cursor.mentor=m; cursor.mentee=m; };

  /* 도메인 나열 순서: 대분류별 하위 도메인 → 대분류 없는 도메인 */
  const order=[];
  gkeys().forEach(gk=>dkeys().filter(k=>S.domains[k].group===gk).forEach(k=>order.push([gk,k])));
  dkeys().filter(k=>!S.groups[S.domains[k].group]).forEach(k=>order.push([null,k]));

  let prevG;
  order.forEach(([gk,k])=>{
    if(prevG!==undefined && gk!==prevG){
      /* 대분류가 바뀌는 지점: 두 대분류를 걸친 사람을 먼저 놓는다 */
      ids().filter(i=>!placed.has(i)&&S.people[i].tier!=='lead'&&isCross(i)).forEach(put);
      sync();
    }
    ['mentor','mentee'].forEach(t=>{
      ids().filter(i=>!placed.has(i)&&S.people[i].tier===t&&primary(i)===k&&!isCross(i)).forEach(put);
    });
    sync();
    prevG=gk;
  });
  ids().filter(i=>!placed.has(i)&&S.people[i].tier!=='lead').forEach(put);

  const xs=ids().filter(i=>S.people[i].tier!=='lead').map(i=>S.people[i].x);
  const mid=xs.length?Math.round((Math.min(...xs)+Math.max(...xs))/2):600;
  lead.forEach(i=>{ S.people[i].x=mid; S.people[i].y=52; });
  refreshGraph();
}

function exportHTML(){
  const prevSel=sel, prevEdit=edit;
  DATA_EL.textContent = '\n' + JSON.stringify(S,null,1).replace(/</g,'\\u003c') + '\n';
  $('nodes').innerHTML=''; $('zones').innerHTML=''; $('elayer').innerHTML=''; $('defs').innerHTML=''; $('panel').innerHTML='';
  $('t-title').textContent=''; $('t-sub').textContent=''; $('t-foot').textContent=''; $('saveState').innerHTML='';
  $('editBtn').classList.remove('on');
  document.body.classList.remove('editing');
  $('stage').removeAttribute('style'); $('wrap').removeAttribute('style');
  $('edges').removeAttribute('width'); $('edges').removeAttribute('height');

  ['appcode','cipher','gatescript','robotsmeta'].forEach(k=>{const e=document.getElementById(k); if(e) e.remove();});
  const html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;

  sel=prevSel; edit=prevEdit;
  document.body.classList.toggle('editing', edit);
  $('editBtn').classList.toggle('on', edit);
  renderAll();
  paintSave(savedAt?'saved':'');

  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
  a.download='team-map.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* 편집 동작 전부를 한 겹 감싸서, 끝날 때마다 자동 저장이 걸리게 한다.
   (함수 선언은 전역에 올라오므로 인라인 핸들러도 이 래퍼를 통과한다) */
['setP','setDoms','setLines','setInfo','setRel','delRel','addRel','addPerson','delPerson',

<script id="gatescript">
(function(){
  var gate=document.getElementById('gate'), pw=document.getElementById('gpw'),
      btn=document.getElementById('gbtn'), msg=document.getElementById('gmsg');
  document.body.classList.add('locked');
  pw.focus();

  if(!(window.crypto && crypto.subtle)){
    msg.textContent='이 브라우저에서는 복호화를 지원하지 않습니다. https 주소로 최신 브라우저에서 열어주세요.';
    btn.disabled=true; return;
  }
  var C=JSON.parse(document.getElementById('cipher').textContent);
  function b64(s){ var r=atob(s), a=new Uint8Array(r.length); for(var i=0;i<r.length;i++) a[i]=r.charCodeAt(i); return a; }

  function unlock(p){
    var enc=new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(p), 'PBKDF2', false, ['deriveKey'])
      .then(function(km){
        return crypto.subtle.deriveKey(
          {name:'PBKDF2', salt:b64(C.salt), iterations:C.iter, hash:'SHA-256'},
          km, {name:'AES-GCM', length:256}, false, ['decrypt']);
      })
      .then(function(k){ return crypto.subtle.decrypt({name:'AES-GCM', iv:b64(C.iv)}, k, b64(C.ct)); })
      .then(function(buf){ return new TextDecoder().decode(buf); });
  }

  function boot(json){
    document.getElementById('appdata').textContent=json;
    document.body.classList.remove('locked');
    gate.remove();
    var s=document.createElement('script');
    s.textContent=document.getElementById('appcode').textContent;
    document.body.appendChild(s);
  }

  function go(){
    var p=pw.value;
    if(!p){ msg.textContent='암호를 입력해 주세요.'; return; }
    btn.disabled=true; btn.textContent='여는 중…'; msg.textContent='';
    unlock(p).then(boot).catch(function(){
      btn.disabled=false; btn.textContent='열기';
      msg.textContent='암호가 맞지 않습니다.';
      pw.select();
    });
  }
  btn.addEventListener('click', go);
  pw.addEventListener('keydown', function(e){ if(e.key==='Enter') go(); });
})();</script>
